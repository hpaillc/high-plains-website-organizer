<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>High Plains Aerial Imaging — Website Command Center</title>
<style>
:root{--bg:#f3f5f7;--panel:#fff;--ink:#17212b;--muted:#687582;--line:#d9e0e6;--blue:#1f5f8b;--blue2:#164766;--gold:#b77a20;--green:#2e7d50;--shadow:0 6px 18px rgba(20,35,50,.07)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,Segoe UI,Arial,sans-serif}
header{background:linear-gradient(135deg,#123c59,#21658f);color:#fff;padding:22px 4vw;display:flex;align-items:center;justify-content:space-between;gap:20px}
h1{margin:0;font-size:25px}.subtitle{opacity:.86;margin-top:3px}.version{background:#ffffff1f;padding:7px 11px;border-radius:18px;font-size:12px}
nav{background:#fff;border-bottom:1px solid var(--line);padding:9px 4vw;display:flex;gap:7px;flex-wrap:wrap;position:sticky;top:0;z-index:3}
nav button,.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 11px;cursor:pointer;color:var(--ink)}nav button.active,.primary{background:var(--blue)!important;color:#fff!important;border-color:var(--blue)!important}
main{max-width:1450px;margin:22px auto;padding:0 18px}.view{display:none}.view.active{display:block}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:16px;box-shadow:var(--shadow)}.stat{font-size:25px;font-weight:700}.label{color:var(--muted);font-size:12px}.two{display:grid;grid-template-columns:1.35fr 1fr;gap:15px;margin-top:15px}
h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:0 0 6px}.muted{color:var(--muted)}.list{display:flex;flex-direction:column;gap:8px}.item{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;align-items:center;justify-content:space-between;gap:10px}.status,.pill{font-size:11px;border-radius:14px;padding:4px 8px;background:#edf1f4}.high{background:#fff1dc;color:#9a6217}.done{background:#e7f4eb;color:var(--green)}
.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select,.form input,.form textarea,.form select{border:1px solid var(--line);border-radius:7px;padding:8px;background:#fff}.toolbar input{min-width:230px}
.table{width:100%;border-collapse:collapse;background:#fff}.table th,.table td{border-bottom:1px solid var(--line);padding:9px;text-align:left;vertical-align:top}.table th{font-size:11px;text-transform:uppercase;color:var(--muted)}code{background:#eef2f5;padding:2px 4px;border-radius:4px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.form textarea{min-height:75px;width:100%}.actions{display:flex;gap:7px;justify-content:flex-end;margin-top:12px}.section-gap{margin-top:15px}.bar{height:8px;background:#e8edf0;border-radius:9px;overflow:hidden}.bar>span{display:block;height:100%;background:var(--blue)}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}}
@media(max-width:560px){.grid{grid-template-columns:1fr}header{padding:18px}.version{display:none}}
</style>
</head>
<body>
<header><div><h1>High Plains Aerial Imaging LLC</h1><div class="subtitle">Website Command Center • highplainsaerialimagingllc.com</div></div><div class="version">Website V2.4</div></header>
<nav id="nav"></nav>
<main>
<section id="dashboard" class="view active"></section>
<section id="website" class="view"></section>
<section id="services" class="view"></section>
<section id="media" class="view"></section>
<section id="content" class="view"></section>
<section id="seo" class="view"></section>
<section id="leads" class="view"></section>
<section id="settings" class="view"></section>
</main>
<script>
const starter={
pages:[
["Home","/","Live","High","Homepage hero, proof, service paths and quote CTA."],
["Services","/services/","Draft","High","Master service directory."],
["Agriculture & Drone Spraying","/services/agriculture/","Draft","High","Agricultural drone services and spraying support."],
["Oil & Gas","/services/oil-gas/","Draft","High","Pipeline, facility and thermal inspection services."],
["Construction","/services/construction/","Draft","High","Progress monitoring, mapping, thermal and stockpiles."],
["Thermal Inspections","/services/thermal/","Draft","High","Thermal inspection applications and reporting."],
["Mapping & Photogrammetry","/services/mapping/","Draft","High","Orthomosaics, 3D models and site documentation."],
["Real Estate","/services/real-estate/","Draft","Medium","Aerial photography and video."],
["Ranching & Livestock","/services/ranching/","Draft","Medium","Large-acreage observation and livestock visibility."],
["About","/about/","Draft","Medium","Company story, credentials and safety."],
["Projects / Gallery","/projects/","Draft","High","Proof of work by industry."],
["Service Area","/service-area/","Draft","Medium","Wyoming coverage and travel information."],
["FAQ","/faq/","Planned","Medium","Common questions, workflow and deliverables."],
["Contact / Request a Quote","/contact/","Draft","High","Lead form, phone and email."]
],
services:[
["Agriculture & Drone Spraying","Crop imaging, application support, field scouting and livestock visibility.","High"],
["Oil & Gas","Pipeline, facility, thermal and infrastructure inspection.","High"],
["Construction","Progress monitoring, site mapping, thermal imaging and stockpile measurement.","High"],
["Thermal Inspections","Non-contact thermal imaging and documentation of heat anomalies.","High"],
["Mapping & Photogrammetry","Orthomosaics, 3D models, photogrammetry and site documentation.","High"],
["Real Estate","Professional aerial photography and video.","Medium"],
["Ranching & Livestock","Large-acreage observation and ranch documentation.","Medium"],
["Commercial / Roof Inspections","High-resolution visual inspection while reducing unnecessary access hazards.","Medium"]
],
media:[
["Drone over Wyoming ranch","Ranching","Needed"],["Pipeline inspection","Oil & Gas","Needed"],["Construction progress","Construction","Needed"],["Thermal inspection example","Thermal","Needed"],["Agricultural drone in field","Agriculture","Needed"],["Aerial real estate property","Real Estate","Needed"],["Mapping/orthomosaic example","Mapping","Needed"],["Company/team photo","About","Needed"]
],
content:[
["Home","Hero headline + CTA","Copy","Open"],["Oil & Gas","Inspection service copy","Copy","Open"],["Thermal Inspections","Capabilities + limitations","Copy","Open"],["Construction","Progress monitoring + stockpile copy","Copy","Open"],["Agriculture","Drone spraying service copy","Copy","Open"],["About","Company story + credentials","Copy","Open"],["FAQ","Common client questions","Copy","Open"],["Gallery","Project captions","Copy","Open"]
],
seo:[
["drone services Wyoming","Home / Service Area","High"],["commercial drone services Wyoming","Home","High"],["drone inspections Wyoming","Services","High"],["thermal drone inspections Wyoming","Thermal","High"],["drone mapping Wyoming","Mapping","High"],["construction drone progress monitoring Wyoming","Construction","High"],["oil and gas drone inspection Wyoming","Oil & Gas","High"],["pipeline drone inspection Wyoming","Oil & Gas","High"],["agricultural drone services Wyoming","Agriculture","High"],["drone spraying Wyoming","Agriculture","High"],["ranch drone services Wyoming","Ranching","Medium"],["aerial real estate photography Wyoming","Real Estate","Medium"]
],
leads:[
["Website inquiry","General","New","Follow up"],["Oil & Gas prospect","Oil & Gas","Prospect","Contact"],["Construction prospect","Construction","Prospect","Contact"],["Ranch prospect","Ranching","Prospect","Contact"]
]};
let d=JSON.parse(localStorage.getItem("hpV24")||"null")||starter;
const tabs=[["dashboard","Dashboard"],["website","Website"],["services","Services"],["media","Photos & Video"],["content","Content"],["seo","SEO"],["leads","Leads / Projects"],["settings","Settings"]];
function save(){localStorage.setItem("hpV24",JSON.stringify(d));render()}
function nav(){document.getElementById("nav").innerHTML=tabs.map((x,i)=>`<button class="${i===0?'active':''}" onclick="show('${x[0]}',this)">${x[1]}</button>`).join("")}
function show(id,b){document.querySelectorAll(".view").forEach(x=>x.classList.remove("active"));document.getElementById(id).classList.add("active");document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()}
function dash(){let live=d.pages.filter(x=>x[2]==="Live").length, doneC=d.content.filter(x=>x[3]==="Done").length, doneM=d.media.filter(x=>x[2]==="Done").length, open=d.leads.filter(x=>x[2]!=="Closed").length, pct=Math.round((live/d.pages.length)*100);
return `<div class="grid"><div class="card"><div class="stat">${d.pages.length}</div><div class="label">Website pages</div></div><div class="card"><div class="stat">${live}</div><div class="label">Live pages</div></div><div class="card"><div class="stat">${d.services.length}</div><div class="label">Service groups</div></div><div class="card"><div class="stat">${open}</div><div class="label">Open leads/projects</div></div></div>
<div class="two"><div class="card"><h2>Website progress</h2><div class="bar"><span style="width:${pct}%"></span></div><p class="muted">${pct}% of pages marked Live.</p><div class="list">${d.pages.slice(0,7).map(x=>`<div class="item"><div><b>${x[0]}</b><div class="muted">${x[1]}</div></div><span class="status ${x[2]==="Live"?"done":"high"}">${x[2]}</span></div>`).join("")}</div></div>
<div class="card"><h2>Next priorities</h2><div class="list">${d.content.filter(x=>x[3]!=="Done").slice(0,6).map(x=>`<div class="item"><div><b>${x[1]}</b><div class="muted">${x[0]} • ${x[2]}</div></div><span class="status high">Open</span></div>`).join("")}</div></div></div>`}
function website(){return `<div class="card"><h2>Website Pages</h2><div class="toolbar"><input id="psearch" placeholder="Search pages..." oninput="renderWebsite()"><select id="pfilter" onchange="renderWebsite()"><option>All</option><option>Live</option><option>Draft</option><option>Planned</option></select></div><div id="plist"></div></div>`}
function renderWebsite(){let q=(psearch?.value||"").toLowerCase(),f=pfilter?.value||"All";let a=d.pages.filter(x=>x[0].toLowerCase().includes(q)&&(f==="All"||x[2]===f));document.getElementById("plist").innerHTML=`<table class="table"><thead><tr><th>Page</th><th>URL</th><th>Status</th><th>Priority</th><th>Purpose</th></tr></thead><tbody>${a.map(x=>{let i=d.pages.indexOf(x);return `<tr><td><b>${x[0]}</b></td><td><code>${x[1]}</code></td><td><select onchange="d.pages[${i}][2]=this.value;save()"><option ${x[2]==="Live"?"selected":""}>Live</option><option ${x[2]==="Draft"?"selected":""}>Draft</option><option ${x[2]==="Planned"?"selected":""}>Planned</option></select></td><td>${x[3]}</td><td>${x[4]}</td></tr>`}).join("")}</tbody></table>`}
function services(){return `<div class="card"><h2>Services</h2><div class="grid">${d.services.map((x,i)=>`<div class="card"><h3>${x[0]}</h3><p class="muted">${x[1]}</p><span class="pill">${x[2]} priority</span></div>`).join("")}</div></div>`}
function media(){return `<div class="card"><h2>Photo & Video Manager</h2><p class="muted">Track the visual assets needed to make the website feel real and industry-specific.</p><table class="table"><thead><tr><th>Asset</th><th>Page</th><th>Status</th></tr></thead><tbody>${d.media.map((x,i)=>`<tr><td><b>${x[0]}</b></td><td>${x[1]}</td><td><button class="btn ${x[2]==="Done"?"":"primary"}" onclick="d.media[${i}][2]=d.media[${i}][2]==='Done'?'Needed':'Done';save()">${x[2]}</button></td></tr>`).join("")}</tbody></table></div>`}
function content(){return `<div class="card"><h2>Content Manager</h2><table class="table"><thead><tr><th>Page</th><th>Content item</th><th>Type</th><th>Status</th></tr></thead><tbody>${d.content.map((x,i)=>`<tr><td>${x[0]}</td><td><b>${x[1]}</b></td><td>${x[2]}</td><td><button class="btn ${x[3]==="Done"?"":"primary"}" onclick="d.content[${i}][3]=d.content[${i}][3]==='Done'?'Open':'Done';save()">${x[3]}</button></td></tr>`).join("")}</tbody></table></div>`}
function seo(){return `<div class="card"><h2>SEO Manager</h2><p class="muted">Starting Wyoming-focused keyword map. Use keywords naturally in useful page copy, titles and descriptions.</p><table class="table"><thead><tr><th>Keyword</th><th>Target page</th><th>Priority</th></tr></thead><tbody>${d.seo.map(x=>`<tr><td><b>${x[0]}</b></td><td>${x[1]}</td><td><span class="pill">${x[2]}</span></td></tr>`).join("")}</tbody></table></div>`}
function leads(){return `<div class="card"><h2>Leads / Projects</h2><table class="table"><thead><tr><th>Lead / Project</th><th>Industry</th><th>Status</th><th>Next action</th></tr></thead><tbody>${d.leads.map((x,i)=>`<tr><td><b>${x[0]}</b></td><td>${x[1]}</td><td><select onchange="d.leads[${i}][2]=this.value;save()">${["New","Prospect","Quoted","Won","Closed"].map(s=>`<option ${x[2]===s?"selected":""}>${s}</option>`).join("")}</select></td><td>${x[3]}</td></tr>`).join("")}</tbody></table></div>`}
function settings(){return `<div class="card"><h2>Command Center Settings</h2><p class="muted">Your data is stored in this browser. It does not change your live High Plains website.</p><div class="actions"><button class="btn primary" onclick="exportPlan()">Export Plan</button><button class="btn" onclick="document.getElementById('imp').click()">Import Plan</button><button class="btn" onclick="if(confirm('Reset V2.4 data?')){localStorage.removeItem('hpV24');location.reload()}">Reset</button></div><input id="imp" type="file" accept=".json" hidden onchange="importPlan(event)"><div class="section-gap"><h3>GitHub Pages</h3><p class="muted">Replace the repository's <code>index.html</code> with this V2.4 file, commit the change, and GitHub Pages will rebuild the organizer.</p><p><b>Repository:</b> high-plains-website-organizer-</p></div></div>`}
function exportPlan(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:"application/json"}));a.download="high-plains-command-center-v2.4.json";a.click()}
function importPlan(e){let r=new FileReader();r.onload=()=>{try{d=JSON.parse(r.result);save()}catch{alert("Invalid plan file.")}};r.readAsText(e.target.files[0])}
function render(){dashboard.innerHTML=dash();websiteEl.innerHTML=website();servicesEl.innerHTML=services();mediaEl.innerHTML=media();contentEl.innerHTML=content();seoEl.innerHTML=seo();leadsEl.innerHTML=leads();settingsEl.innerHTML=settings();if(document.getElementById("plist"))renderWebsite()}
const dashboard=document.getElementById("dashboard"),websiteEl=document.getElementById("website"),servicesEl=document.getElementById("services"),mediaEl=document.getElementById("media"),contentEl=document.getElementById("content"),seoEl=document.getElementById("seo"),leadsEl=document.getElementById("leads"),settingsEl=document.getElementById("settings");
nav();render();
</script>
</body>
</html>
